<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <title>Quản Lý Danh Mục</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Tiêu đề trang & Nút Thêm mới -->
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h3 fw-bold text-dark mb-0">
                <i class="bi bi-grid-fill me-2 text-primary"></i>Quản Lý Danh Mục (Category)
            </h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a th:href="@{/admin/categories/add}" class="btn btn-primary shadow-sm">
                    <i class="bi bi-plus-circle-fill me-1"></i> Thêm Mới Danh Mục
                </a>
            </div>
        </div>

        <!-- Thanh tìm kiếm & bộ lọc -->
        <div class="card shadow-sm mb-4 border-0 rounded-3">
            <div class="card-body p-3">
                <form th:action="@{/admin/categories}" method="get" class="row g-3 align-items-center">
                    <!-- Bảo lưu sắp xếp khi tìm kiếm -->
                    <input type="hidden" name="sortField" th:value="${sortField}">
                    <input type="hidden" name="sortDir" th:value="${sortDir}">

                    <!-- Ô nhập từ khóa tìm kiếm -->
                    <div class="col-md-6 col-lg-5">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="keyword" class="form-control" placeholder="Tìm kiếm theo tên danh mục..."
                                   th:value="${keyword}">
                        </div>
                    </div>

                    <!-- Lựa chọn kích thước trang (Page Size) -->
                    <div class="col-md-3 col-lg-2">
                        <select name="size" class="form-select" onchange="this.form.submit()">
                            <option value="5" th:selected="${pageSize == 5}">5 dòng/trang</option>
                            <option value="10" th:selected="${pageSize == 10}">10 dòng/trang</option>
                            <option value="20" th:selected="${pageSize == 20}">20 dòng/trang</option>
                        </select>
                    </div>

                    <!-- Nút tìm kiếm & Đặt lại -->
                    <div class="col-auto">
                        <button type="submit" class="btn btn-dark">
                            <i class="bi bi-funnel-fill me-1"></i> Tìm kiếm
                        </button>
                        <a th:if="${keyword != null and !keyword.trim().empty}" 
                           th:href="@{/admin/categories}" 
                           class="btn btn-outline-secondary ms-1">
                            <i class="bi bi-arrow-counterclockwise"></i> Đặt lại
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bảng dữ liệu Category -->
        <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col" class="text-center" style="width: 60px;">#</th>
                                <th scope="col" style="width: 100px;">
                                    <a th:href="@{/admin/categories(keyword=${keyword}, page=${currentPage}, size=${pageSize}, sortField='id', sortDir=${reverseSortDir})}" 
                                       class="text-white text-decoration-none">
                                        ID <i class="bi bi-arrow-down-up small ms-1"></i>
                                    </a>
                                </th>
                                <th scope="col">
                                    <a th:href="@{/admin/categories(keyword=${keyword}, page=${currentPage}, size=${pageSize}, sortField='categoryName', sortDir=${reverseSortDir})}" 
                                       class="text-white text-decoration-none">
                                        Tên Danh Mục <i class="bi bi-arrow-down-up small ms-1"></i>
                                    </a>
                                </th>
                                <th scope="col" style="width: 160px;" class="text-center">Biểu Tượng</th>
                                <th scope="col" style="width: 160px;" class="text-center">Trạng Thái</th>
                                <th scope="col" style="width: 180px;" class="text-center">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Lặp danh sách danh mục -->
                            <tr th:each="cat, loop : ${categoryPage.content}">
                                <td class="text-center text-muted fw-bold" 
                                    th:text="${(currentPage - 1) * pageSize + loop.index + 1}">
                                    1
                                </td>
                                <td class="fw-bold" th:text="${cat.id}">1</td>
                                <td>
                                    <span class="fw-semibold text-dark" th:text="${cat.categoryName}">Điện thoại</span>
                                </td>
                                <td class="text-center">
                                    <th:block th:if="${cat.icon != null and !cat.icon.trim().empty}">
                                        <i class="bi fs-5 text-primary me-1" th:classappend="${cat.icon}"></i>
                                        <span class="small text-muted" th:text="'(' + ${cat.icon} + ')'"></span>
                                    </th:block>
                                    <span th:if="${cat.icon == null or cat.icon.trim().empty}" class="text-muted fst-italic">
                                        Không có
                                    </span>
                                </td>
                                <td class="text-center">
                                    <span th:if="${cat.status}" class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">
                                        <i class="bi bi-check-circle me-1"></i>Hoạt động
                                    </span>
                                    <span th:unless="${cat.status}" class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1">
                                        <i class="bi bi-lock-fill me-1"></i>Đã khóa
                                    </span>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}" 
                                           class="btn btn-outline-primary" title="Chỉnh sửa">
                                            <i class="bi bi-pencil-square"></i> Sửa
                                        </a>
                                        <a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}" 
                                           class="btn btn-outline-danger" title="Xóa"
                                           th:onclick="'return confirm(\'Bạn có chắc chắn muốn xóa danh mục: [' + ${cat.categoryName} + '] không?\');'">
                                            <i class="bi bi-trash"></i> Xóa
                                        </a>
                                    </div>
                                </td>
                            </tr>

                            <!-- Dòng hiển thị khi không có dữ liệu -->
                            <tr th:if="${categoryPage.totalElements == 0}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary"></i>
                                    Không tìm thấy danh mục nào phù hợp!
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Phân trang (Pagination Footer) -->
            <div th:if="${totalPages > 0}" class="card-footer bg-white d-flex flex-wrap justify-content-between align-items-center py-3">
                <div class="small text-muted mb-2 mb-md-0">
                    Hiển thị từ <b th:text="${(currentPage - 1) * pageSize + 1}">1</b> đến 
                    <b th:text="${currentPage * pageSize > totalElements ? totalElements : currentPage * pageSize}">5</b> 
                    trong tổng số <b th:text="${totalElements}">15</b> danh mục
                </div>

                <nav th:if="${totalPages > 1}" aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0">
                        <!-- Nút Trang trước -->
                        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                            <a class="page-link" 
                               th:href="@{/admin/categories(keyword=${keyword}, page=${currentPage - 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}">
                                <i class="bi bi-chevron-left"></i> Trước
                            </a>
                        </li>

                        <!-- Danh sách số trang -->
                        <li class="page-item" 
                            th:each="i : ${#numbers.sequence(1, totalPages)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" 
                               th:href="@{/admin/categories(keyword=${keyword}, page=${i}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
                               th:text="${i}">1</a>
                        </li>

                        <!-- Nút Trang sau -->
                        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                            <a class="page-link" 
                               th:href="@{/admin/categories(keyword=${keyword}, page=${currentPage + 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}">
                                Sau <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
