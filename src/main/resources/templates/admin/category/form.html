<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <title th:text="${pageTitle}">Thông Tin Danh Mục</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Tiêu đề trang & Nút quay lại -->
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h3 fw-bold text-dark mb-0">
                <i class="bi bi-folder-fill me-2 text-primary"></i><span th:text="${pageTitle}">Thêm Mới Danh Mục</span>
            </h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
                </a>
            </div>
        </div>

        <div class="row justify-content-center mt-3">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
                    <div class="card-header bg-dark text-white py-3">
                        <h5 class="card-title mb-0 fs-6 fw-bold">
                            <i class="bi bi-pencil-square me-2"></i>Chi Tiết Thông Tin Danh Mục
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
                            <!-- Trường ẩn ID khi chỉnh sửa -->
                            <input type="hidden" th:field="*{id}"/>

                            <!-- Tên danh mục -->
                            <div class="mb-3">
                                <label for="categoryName" class="form-label fw-bold">
                                    Tên Danh Mục <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="categoryName" th:field="*{categoryName}" 
                                       placeholder="Ví dụ: Điện thoại, Laptop, Đồng hồ, Thời trang..." required>
                                <div class="form-text">Tên danh mục là thông tin bắt buộc hiển thị trên hệ thống.</div>
                            </div>

                            <!-- Biểu tượng / Icon -->
                            <div class="mb-3">
                                <label for="icon" class="form-label fw-bold">Biểu Tượng (Bootstrap Icon Class)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">
                                        <i id="iconPreview" class="bi fs-5" 
                                           th:classappend="*{icon != null and !icon.trim().empty} ? *{icon} + ' text-primary' : 'bi-tag text-muted'"></i>
                                    </span>
                                    <input type="text" class="form-control" id="icon" th:field="*{icon}" 
                                           placeholder="Ví dụ: bi-phone, bi-laptop, bi-headphones, bi-camera"
                                           oninput="updateIconPreview(this.value)">
                                </div>
                                <div class="form-text">
                                    Nhập mã class Bootstrap Icon (xem trước trực tiếp ở ô bên trái). Bạn có thể tra cứu tại 
                                    <a href="https://icons.getbootstrap.com/" target="_blank" class="text-decoration-none">Bootstrap Icons</a>.
                                </div>
                            </div>

                            <!-- Trạng thái -->
                            <div class="mb-4">
                                <label class="form-label fw-bold d-block">Trạng Thái Hoạt Động</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" id="statusActive" th:field="*{status}" value="true">
                                    <label class="form-check-label text-success fw-semibold" for="statusActive">
                                        <i class="bi bi-check-circle me-1"></i>Hoạt động
                                    </label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" id="statusLocked" th:field="*{status}" value="false">
                                    <label class="form-check-label text-danger fw-semibold" for="statusLocked">
                                        <i class="bi bi-lock me-1"></i>Khóa (Ẩn)
                                    </label>
                                </div>
                            </div>

                            <!-- Nút bấm hành động -->
                            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                                <a th:href="@{/admin/categories}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle me-1"></i> Hủy Bỏ
                                </a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save-fill me-1"></i> Lưu Thông Tin
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script cập nhật trực tiếp preview icon khi người dùng nhập liệu -->
    <th:block layout:fragment="custom-scripts">
        <script>
            function updateIconPreview(iconName) {
                const preview = document.getElementById('iconPreview');
                if (iconName && iconName.trim() !== '') {
                    preview.className = 'bi ' + iconName.trim() + ' fs-5 text-primary';
                } else {
                    preview.className = 'bi bi-tag fs-5 text-muted';
                }
            }
        </script>
    </th:block>
</body>
</html>
